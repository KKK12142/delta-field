# 골든벨 문제 파일 예시(형식 안내용). 이 파일을 본떠 같은 폴더에 새 .yaml 파일을 만듭니다.
# 선생님이 만든 문제 파일은 공개 저장소에 올라가지 않습니다(.gitignore). 이 예시 파일만 올라갑니다.
#
# title: 골든벨을 시작할 때 고르는 목록에 보이는 이름
# questions: 문제 목록. 문제마다 줄 맨 앞에 "- "를 쓰고, 아래 줄들은 같은 칸만큼 들여 씁니다.
#   type: ox(OX 문제) 또는 choice(객관식)
#   question: 문제 글
#   choices: 객관식 보기 2~4개. [보기1, 보기2, ...]처럼 씁니다(OX 문제에는 쓰지 않습니다).
#   answer: OX는 O 또는 X, 객관식은 정답 보기의 번호(1부터)
#   seconds: 제한 시간(초, 3~600)
# 글에 콜론(:)이나 #이 들어가면 글 전체를 큰따옴표로 감쌉니다. 예: question: "비율 1:2는 ..."

title: 예시 골든벨(역학)
questions:
  - type: ox
    question: 등속 직선 운동을 하는 물체에 작용하는 알짜힘은 0입니다.
    answer: O
    seconds: 15

  - type: choice
    question: 질량 2 kg인 물체에 6 N의 알짜힘이 작용할 때, 가속도의 크기는 얼마입니까?
    choices: [1 m/s², 3 m/s², 6 m/s², 12 m/s²]
    answer: 2
    seconds: 30

  - type: ox
    question: 공기 저항이 없을 때, 무거운 물체가 가벼운 물체보다 먼저 땅에 떨어집니다.
    answer: X
    seconds: 15

  - type: choice
    question: 물체를 가만히 놓아 떨어뜨렸습니다. 중력 가속도가 10 m/s²이고 공기 저항을 무시할 때, 2초 뒤 물체의 속력은 얼마입니까?
    choices: [5 m/s, 10 m/s, 20 m/s, 40 m/s]
    answer: 3
    seconds: 30

  - type: ox
    question: 작용 반작용 법칙에서 두 힘은 서로 다른 물체에 작용합니다.
    answer: O
    seconds: 15
