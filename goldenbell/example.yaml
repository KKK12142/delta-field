# 골든벨 문제 파일 예시(형식 안내용). 이 파일을 본떠 같은 폴더에 새 .yaml 파일을 만듭니다.
# 선생님이 만든 문제 파일은 공개 저장소에 올라가지 않습니다(.gitignore). 이 예시 파일만 올라갑니다.
#
# title: 골든벨을 시작할 때 고르는 목록에 보이는 이름
# questions: 문제 목록. 문제마다 줄 맨 앞에 "- "를 쓰고, 아래 줄들은 같은 칸만큼 들여 씁니다.
#   type: ox(OX 문제), choice(객관식), short(단답형: 학생이 답을 글자로 써서 냄)
#   question: 문제 글
#   choices: 객관식 보기 2~4개. [보기1, 보기2, ...]처럼 씁니다(OX 문제에는 쓰지 않습니다).
#   answer: OX는 O 또는 X, 객관식은 정답 보기의 번호(1부터)
#   answers: 단답형 정답. 맞는 표현을 모두 [정답1, 정답2]처럼 씁니다(단답형에는 answer 대신 씁니다).
#     빈칸, 대소문자, m/s²와 m/s^2, 끝의 마침표는 따지지 않고, 정답이 "10 m/s"면 단위를 빼고 쓴 10도 맞습니다.
#     쉼표로 나뉜 여러 답은 순서가 달라도 맞습니다. 그 밖의 표현(예: 0.67과 2/3)은 적어 둔 것만 맞습니다.
#   explain: 해설(쓰지 않아도 됩니다). 정답을 공개할 때 모두의 화면에 보입니다.
#   seconds: 제한 시간(초, 3~600)
# 글에 콜론(:)이나 #이 들어가면 글 전체를 큰따옴표로 감쌉니다. 예: question: "비율 1:2는 ..."

title: 예시 골든벨(물리)
questions:
  - type: ox
    question: 등속 직선 운동을 하는 물체에 작용하는 알짜힘은 0입니다.
    answer: O
    seconds: 5

  - type: choice
    question: 질량 2 kg인 물체에 6 N의 알짜힘이 작용할 때, 가속도의 크기는 얼마입니까?
    choices: [1 m/s², 3 m/s², 6 m/s², 12 m/s²]
    answer: 2
    seconds: 5

  - type: ox
    question: 공기 저항이 없을 때, 무거운 물체가 가벼운 물체보다 먼저 땅에 떨어집니다.
    answer: X
    seconds: 5

  - type: choice
    question: 물체를 가만히 놓아 떨어뜨렸습니다. 중력 가속도가 10 m/s²이고 공기 저항을 무시할 때, 2초 뒤 물체의 속력은 얼마입니까?
    choices: [5 m/s, 10 m/s, 20 m/s, 40 m/s]
    answer: 3
    seconds: 5

  - type: ox
    question: 작용 반작용 법칙에서 두 힘은 서로 다른 물체에 작용합니다.
    answer: O
    seconds: 5

  - type: ox
    question: 운동량은 크기와 방향을 함께 가진 물리량입니다.
    answer: O
    seconds: 5

  - type: choice
    question: 질량 2 kg인 물체가 3 m/s로 움직일 때 운동 에너지는 얼마입니까?
    choices: [3 J, 9 J, 18 J, 36 J]
    answer: 2
    seconds: 5

  - type: ox
    question: 마찰과 공기 저항이 없는 경사면을 미끄러져 내려오는 물체의 역학적 에너지는 보존됩니다.
    answer: O
    seconds: 5

  - type: choice
    question: 4 Ω인 저항에 2 A의 전류가 흐를 때, 저항 양 끝의 전압은 얼마입니까?
    choices: [0.5 V, 2 V, 6 V, 8 V]
    answer: 4
    seconds: 5

  - type: ox
    question: 같은 종류의 전하끼리는 서로 끌어당깁니다.
    answer: X
    seconds: 5

  - type: choice
    question: 파장이 2 m이고 진동수가 5 Hz인 파동의 속력은 얼마입니까?
    choices: [10 m/s, 7 m/s, 2.5 m/s, 0.4 m/s]
    answer: 1
    seconds: 5

  - type: ox
    question: 빛은 진공에서도 전파됩니다.
    answer: O
    seconds: 5

  - type: choice
    question: 다음 중 전자기파가 아닌 것은 무엇입니까?
    choices: [X선, 초음파, 적외선, 마이크로파]
    answer: 2
    seconds: 5

  - type: ox
    question: 광전 효과에서 금속에 비추는 빛의 세기만 키우면, 튀어나오는 전자의 최대 운동 에너지가 커집니다.
    answer: X
    seconds: 5

  - type: choice
    question: 긴 직선 도선에 흐르는 전류의 세기가 2배가 되면, 도선에서 같은 거리에 있는 점의 자기장 세기는 어떻게 됩니까?
    choices: [절반이 된다, 그대로다, 2배가 된다]
    answer: 3
    seconds: 5

  - type: short
    question: 물체가 운동 상태를 그대로 유지하려는 성질을 무엇이라고 합니까?
    answers: [관성]
    explain: 뉴턴 운동 제1법칙을 관성 법칙이라고도 합니다.
    seconds: 15

  - type: short
    question: 정지해 있던 물체가 2 m/s²로 5초 동안 가속하면 속력은 얼마가 됩니까?
    answers: [10 m/s]
    explain: v = at = 2 × 5 = 10 m/s입니다.
    seconds: 20

  - type: short
    question: 빛의 삼원색을 모두 씁니다(쉼표로 나눕니다).
    answers: ["빨강, 초록, 파랑", "빨간색, 초록색, 파란색", "R, G, B"]
    seconds: 20
